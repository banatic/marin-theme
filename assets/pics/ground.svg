<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%'>
<defs>
<pattern id='fine' width='12' height='12' patternUnits='userSpaceOnUse'><circle cx='3' cy='3' r='1.5' fill='#fff'/><circle cx='9' cy='9' r='1.5' fill='#fff'/></pattern>
<pattern id='bold' width='12' height='12' patternUnits='userSpaceOnUse'><circle cx='3' cy='3' r='2.4' fill='#fff'/><circle cx='9' cy='9' r='2.4' fill='#fff'/></pattern>
<linearGradient id='from-top' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#fff'/><stop offset='.46' stop-color='#000'/></linearGradient>
<linearGradient id='from-bottom' x1='1' y1='1' x2='0' y2='0'><stop offset='0' stop-color='#fff'/><stop offset='.4' stop-color='#000'/></linearGradient>
<mask id='top'><rect width='100%' height='100%' fill='url(#from-top)'/></mask>
<mask id='bottom'><rect width='100%' height='100%' fill='url(#from-bottom)'/></mask>
</defs>
<rect width='100%' height='100%' fill='#18181c'/>
<rect width='100%' height='100%' fill='url(#fine)' opacity='.16' mask='url(#top)'/>
<rect width='100%' height='100%' fill='url(#bold)' opacity='.12' mask='url(#bottom)'/>
